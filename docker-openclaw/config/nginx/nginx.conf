worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # WebSocket upgrade support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Web UI — port 80 (exposed as 18789 externally)
    server {
        listen 80;

        location / {
            proxy_pass         http://openclaw:18789;
            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            # Forwarding — lets the app know the real client host/IP
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;

            proxy_read_timeout 3600s;   # Long timeout for streaming/agent responses
            proxy_send_timeout 3600s;
        }
    }

    # API — port 18791
    server {
        listen 18791;

        location / {
            proxy_pass         http://openclaw:18791;
            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            # Forwarding
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $host;
            proxy_set_header   X-Forwarded-Port  $server_port;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # CORS — allow browser access from any origin
            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
    }
}
