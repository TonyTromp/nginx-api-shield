services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    expose:
      - "18789"    # Web UI (internal only — nginx fronts this)
      - "18791"    # API   (internal only — nginx fronts this)
    extra_hosts:
      - "host.docker.internal:host-gateway"    # Linux Docker fix
    volumes:
      - ./config:/home/node/.openclaw
      - ./workspace:/workspace
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_API_KEY=ollama-local
      - OPENCLAW_TOOLS_ENABLED=false
      - OPENCLAW_AGENT_TOOLS=false
      - PRIMARY_MODEL=llama3:8b
    restart: unless-stopped
    networks:
      - openclaw-net

  nginx:
    image: nginx:alpine
    container_name: openclaw-nginx
    ports:
      - "18789:80"     # Web UI  — access via http://<server-ip>:18789
      - "18791:18791"  # API     — access via http://<server-ip>:18791
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - openclaw
    restart: unless-stopped
    networks:
      - openclaw-net

networks:
  openclaw-net:
    driver: bridge
